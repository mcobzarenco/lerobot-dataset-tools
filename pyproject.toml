[project]
name = "lerobot-dataset-tools"
version = "0.1.0"
description = "Migrate LeRobot community datasets to the v3.0 format and curate episodes with VLM judges"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.0",
    "anthropic>=0.40",
    "av>=15,<16",
    "bitsandbytes>=0.49",
    "lerobot[dataset]>=0.6",
    "numpy>=2.0",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyarrow>=21.0",
    "torch>=2.7",
    "tqdm>=4.60",
    "transformers>=5.14",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "ruff>=0.15",
]

[tool.uv]
# lerobot caps transformers<5.6, but the Gemma 4 judge (gemma4_unified)
# needs >=5.14. lerobot 0.6 verified working under 5.14.1.
override-dependencies = [
    "transformers>=5.14",
]

[tool.pyright]
include = ["ldtools"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
