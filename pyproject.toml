[project]
name = "lerobot-dataset-tools"
version = "0.1.0"
description = "Migrate LeRobot community datasets to the v3.0 format and repair their metadata"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "av>=15,<16",
    "lerobot[dataset]>=0.6",
    "numpy>=2.0",
    "pandas>=2.0",
    "pyarrow>=21.0",
    "torch>=2.7",
    "tqdm>=4.60",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "ruff>=0.15",
]

[tool.pyright]
include = ["ldtools"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
